name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  check:
    name: ruff, mypy, pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version="$(python -c 'import shazam_desktop; print(shazam_desktop.__version__)')"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package version v${version}" >&2; exit 1; }
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

  build:
    name: build (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-2025
          - name: macos-arm64
            runner: macos-14
          - name: macos-x86_64
            runner: macos-15-intel
    env:
      # Signing and notarization switch on only when the matching secrets exist.
      MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_CERTIFICATE_PWD != '' && secrets.MACOS_SIGN_IDENTITY != '' }}
      MACOS_NOTARIZE: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_SIGN_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
      WINDOWS_SIGNING: ${{ secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PWD != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev,build]"
      - name: Platform tests
        run: pytest -q
      - name: Resolve version
        run: echo "VERSION=$(python -c 'import shazam_desktop; print(shazam_desktop.__version__)')" >> "$GITHUB_ENV"

      # ffmpeg and ffprobe: LGPL-only builds from the pinned, checksum-verified source tarball.
      - name: Restore ffmpeg
        id: ffmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ffmpeg
          key: ffmpeg-${{ matrix.name }}-${{ hashFiles('packaging/build_ffmpeg.sh') }}
      - name: Set up MSYS2
        if: runner.os == 'Windows' && steps.ffmpeg.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: false
          install: >-
            make diffutils curl tar xz
            mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf
      - name: Build ffmpeg (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash packaging/build_ffmpeg.sh build/ffmpeg
      - name: Build ffmpeg (macOS)
        if: runner.os == 'macOS' && steps.ffmpeg.outputs.cache-hit != 'true'
        run: bash packaging/build_ffmpeg.sh build/ffmpeg
      - name: Check ffmpeg license
        run: |
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          for tool in ffmpeg ffprobe; do "build/ffmpeg/${tool}${ext}" -hide_banner -version | head -1; done
          if "build/ffmpeg/ffmpeg${ext}" -hide_banner -buildconf | grep -E -- '--enable-(gpl|nonfree|version3)'; then
            echo "bundled ffmpeg is not LGPL-only" >&2; exit 1
          fi

      # The helper is built natively on each runner (arm64 on macos-14, x86_64 on macos-15-intel).
      - name: Test and build audio helper (macOS)
        if: runner.os == 'macOS'
        run: |
          swift --version
          swift test --package-path macos/AudioHelper
          bash packaging/build_audio_helper.sh build/helper
      - name: Probe helper capture (macOS, informational)
        if: runner.os == 'macOS'
        run: |
          # Hosted runners have no audio hardware and may refuse the privacy request; this only
          # records how the helper reports that, it does not gate the build.
          (sleep 8 | perl -e 'alarm 30; exec @ARGV' build/helper/shazam-audio-helper capture | wc -c) || true

      - name: Build bundle
        env:
          FFMPEG_DIR: ${{ github.workspace }}/build/ffmpeg
          AUDIO_HELPER_DIR: ${{ github.workspace }}/build/helper
        run: pyinstaller --noconfirm --distpath dist --workpath build/pyinstaller packaging/shazam-desktop.spec

      # ---- Windows ----
      - name: Sign executable (optional)
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PWD: ${{ secrets.WINDOWS_CERTIFICATE_PWD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $pfx /p $env:WINDOWS_CERTIFICATE_PWD dist\shazam-desktop.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Remove-Item $pfx
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'selfcheck.txt'
          $process = Start-Process -FilePath dist\shazam-desktop.exe -ArgumentList '--self-check', '--report', $report -Wait -PassThru
          if (Test-Path $report) { Get-Content $report } else { Write-Host 'no report was written' }
          if ($process.ExitCode -ne 0) { throw "self-check exited with code $($process.ExitCode)" }
      - name: Stage release files (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p release
          cp dist/shazam-desktop.exe "release/shazam-desktop-${VERSION}-windows-x64.exe"

      # ---- macOS ----
      - name: Import signing certificate (optional)
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/certificate.p12"
      - name: Sign app
        if: runner.os == 'macOS'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          app="dist/Shazam Desktop.app"
          if [ "$MACOS_SIGNING" = "true" ]; then
            codesign --force --deep --timestamp --options runtime \
              --entitlements packaging/entitlements.plist --sign "$MACOS_SIGN_IDENTITY" "$app"
          else
            codesign --force --deep --sign - "$app"
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: Build disk image
        if: runner.os == 'macOS'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          arch="${{ matrix.name }}"; arch="${arch#macos-}"
          mkdir -p release
          dmg="release/shazam-desktop-${VERSION}-macos-${arch}.dmg"
          bash packaging/make_dmg.sh "dist/Shazam Desktop.app" "$dmg" "Shazam Desktop"
          if [ "$MACOS_SIGNING" = "true" ]; then
            codesign --force --timestamp --sign "$MACOS_SIGN_IDENTITY" "$dmg"
          fi
          echo "DMG=$dmg" >> "$GITHUB_ENV"
      - name: Notarize (optional)
        if: runner.os == 'macOS' && env.MACOS_NOTARIZE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$DMG"
      - name: Smoke test (macOS, from the disk image)
        if: runner.os == 'macOS'
        run: |
          mountpoint="$RUNNER_TEMP/dmg"
          mkdir -p "$mountpoint"
          hdiutil attach -nobrowse -readonly -mountpoint "$mountpoint" "$DMG"
          trap 'hdiutil detach "$mountpoint" -force || true' EXIT
          app="$mountpoint/Shazam Desktop.app"
          echo "--- architectures:"; lipo -archs "$app/Contents/MacOS/shazam-desktop"
          echo "--- microphone usage description:"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Contents/Info.plist"
          echo "--- audio capture usage description:"
          /usr/libexec/PlistBuddy -c 'Print :NSAudioCaptureUsageDescription' "$app/Contents/Info.plist"
          echo "--- audio helper:"
          helper="$(find "$app" -type f -name shazam-audio-helper | head -1)"
          test -n "$helper" || { echo "audio helper is missing from the app" >&2; exit 1; }
          ls -l "$helper"; lipo -archs "$helper"; codesign -dv "$helper" 2>&1 | head -4
          "$helper" --probe
          echo "--- icon:"
          icon="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Contents/Info.plist")"
          ls -l "$app/Contents/Resources/$icon"
          echo "--- signature:"; codesign -dv "$app" 2>&1 | head -6
          echo "--- bundled tools:"; find "$app" -type f \( -name ffmpeg -o -name ffprobe \) -exec ls -l {} \;
          "$app/Contents/MacOS/shazam-desktop" --self-check --report "$RUNNER_TEMP/selfcheck.txt" || status=$?
          cat "$RUNNER_TEMP/selfcheck.txt" 2>/dev/null || echo "no report was written"
          exit "${status:-0}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shazam-desktop-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shazam-desktop-*
          merge-multiple: true
          path: release
      - name: Checksums
        working-directory: release
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Unsigned builds unless stated otherwise; see "Download and run" in the README for the
          macOS Gatekeeper and Windows SmartScreen steps. Verify downloads against `SHA256SUMS`.
          NOTES
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
